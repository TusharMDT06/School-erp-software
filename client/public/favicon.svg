<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- School ERP Premium Brand Gradient -->
    <linearGradient id="schoolErpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1F4E79" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Golden Tassel Gradient -->
    <linearGradient id="goldTassel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="url(#schoolErpBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Graduation Cap (Mortarboard) -->
  <!-- Cap Diamond Top -->
  <path d="M32 14 L54 24 L32 34 L10 24 Z" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />

  <!-- Cap Skull Base -->
  <path d="M19 28.5 V37 C19 41.5 24.5 45 32 45 C39.5 45 45 41.5 45 37 V28.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Golden Tassel & Knot -->
  <circle cx="32" cy="24" r="2.5" fill="#FDE047" />
  <path d="M32 24 L50 25.5 V38" fill="none" stroke="url(#goldTassel)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="39" r="2" fill="#D97706" />
  <path d="M48 40 L52 40 L51 45 L49 45 Z" fill="#F59E0B" />

  <!-- Open Book Base at the bottom -->
  <path d="M18 51 C24 49 29 50 32 52 C35 50 40 49 46 51" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
</svg>